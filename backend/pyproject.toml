[project]
name = "zhenhang-erp-backend"
version = "0.1.0"
description = "Zhenhang Smart Manufacturing ERP - FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# Unit tests only, deliberately: `pytest` with no arguments collects backend/tests and never
# backend/integration_tests, which needs PostgreSQL, Redis and MinIO. The integration suite is run explicitly
# (`pytest integration_tests`) by .github/workflows/ci.yml and is documented in the README. A bare `pytest`
# passing therefore says nothing about it.
testpaths = ["tests"]

# K-007: ruff/mypy are **non-blocking**. Run `python scripts/check_backend_lint.py` (or
# `scripts/check_backend_lint.ps1` from repo root). Baseline counts live in
# `logs/ruff-backend-baseline.txt`. CI must not fail on these until debt is cleared.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests", "integration_tests", "workers"]
exclude = [
  ".venv",
  "alembic/versions",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]
ignore = [
  "E501",  # line length — large historical debt; tracked in baseline, not autofixed en masse
  "B008",  # FastAPI Depends() in defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"integration_tests/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = false
pretty = true
# Incremental adopt: only report errors in `files`; imported deps are silent.
follow_imports = "silent"
files = [
  "app/domains/quote/application/quote_track_helpers.py",
  "app/domains/quote/application/quote_export_payload.py",
  "app/domains/file/infrastructure/minio_client.py",
  "app/repositories/base.py",
  "app/schemas/quote.py",
  "app/core/deps.py",
  "app/core/enterprise_metrics.py",
  "app/core/exceptions.py",
  "app/core/money.py",
  "app/core/response.py",
  "app/core/rbac.py",
  "app/core/monitoring.py",
  "app/core/redis_client.py",
  "app/core/data_scope.py",
  "app/core/security.py",
  "app/core/__init__.py",
  "workers/event_worker.py",
  "workers/maintenance_worker.py",
]
exclude = [
  "alembic/versions/",
  ".venv/",
  "tests/",
  "integration_tests/",
]
